<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="index.css">
    <title>My2ndAngelic</title>
    <script>
    fetch('quotes.txt')
        .then(response => response.text())
        .then(text => {
            const quotes = text.trim().split('\n');
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];

            // Replace ~word~ with <s>word</s>
            const finalQuote = randomQuote.replace(/~(.*?)~/g, '<s>$1</s>');

            document.getElementById('quote').innerHTML = finalQuote;
        })
        .catch(error => {
            console.error('Error loading quotes:', error);
            document.getElementById('quote').innerHTML = 'Welcome to my website!';
        });
</script>
</head>
